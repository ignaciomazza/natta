name: Recover Mercado Pago confirmations

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: natta-payment-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Reconcile payments with a short-lived GitHub identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://www.nattavascas.com/api/payments/reconcile';
          const identity = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          identity.searchParams.set('audience', endpoint);
          let token, tokenAt = 0;
          async function authorization() {
            if (!token || Date.now() - tokenAt >= 120000) {
              const response = await fetch(identity, {
                headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
                signal: AbortSignal.timeout(15000),
              });
              if (!response.ok) throw new Error(`GitHub identity request failed: ${response.status}`);
              ({ value: token } = await response.json());
              tokenAt = Date.now();
            }
            return `Bearer ${token}`;
          }
          const end = new Date().toISOString();
          // The same scheduled identity drains durable order changes and email retries.
          for (let batch = 0; batch < 10; batch++) {
            const response = await fetch(endpoint, { method: 'POST', headers: { Authorization: await authorization(), 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: 'commerce', end }), signal: AbortSignal.timeout(65000) });
            if (!response.ok) throw new Error(`Commerce synchronization failed: HTTP ${response.status}`);
            const result = await response.json();
            if (result.errors) console.error('Some commerce updates remain pending.');
            if (!result.hasMore || result.errors) break;
          }

          let offset = 0, checked = 0, recovered = 0, attention = 0, errors = 0;
          let inboxComplete = false;
          const inboxDeadline = Date.now() + 90000;
          // Bound the inbox sweep so payment searches still run if many old
          // notices fail. Further notices remain durable for the next run.
          for (let batch = 0; batch < 10; batch++) {
            if (Date.now() >= inboxDeadline) break;
            const review = await fetch(endpoint, {
              method: 'POST', headers: { Authorization: await authorization(), 'Content-Type': 'application/json' },
              body: JSON.stringify({ mode: 'notifications', end }), signal: AbortSignal.timeout(65000),
            }).catch(() => null);
            if (!review?.ok) { errors++; break; }
            const result = await review.json();
            checked += result.checked; recovered += result.recovered; errors += result.errors.length;
            if (!result.hasMore) { inboxComplete = true; break; }
          }
          if (!inboxComplete) errors++;
          // The endpoint may return part of an MP page to stay within its
          // invocation budget. Follow its cursor rather than assuming 50 rows.
          for (let page = 0; page < 10000; page++) {
            const review = await fetch(endpoint, {
              method: 'POST', headers: { Authorization: await authorization(), 'Content-Type': 'application/json' },
              body: JSON.stringify({ offset, end }), signal: AbortSignal.timeout(65000),
            });
            if (!review.ok) throw new Error(`Payment reconciliation failed: HTTP ${review.status}`);
            const result = await review.json();
            checked += result.checked; recovered += result.recovered; attention += result.attention.length;
            errors += result.errors.length;
            if (result.nextOffset === null) {
              console.log(JSON.stringify({ checked, recovered, attention, errors }));
              if (errors) throw new Error('Some payment checks failed. See the Natta server logs.');
              if (attention) throw new Error('Some payments require review in the Natta server logs.');
              process.exit(0);
            }
            offset = result.nextOffset;
          }
          throw new Error('Payment reconciliation did not finish pagination.');
          NODE
