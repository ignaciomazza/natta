name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, payment regression and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: natta-test-only
          POSTGRES_DB: natta_payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Payment security smoke tests
        run: npm run security:smoke

      - name: Payment recovery workflow tests
        run: npm run test:payment-workflow

      - name: Payment regression tests with isolated PostgreSQL
        run: npm run test:payments
        env:
          TEST_DATABASE_URL: postgresql://postgres:natta-test-only@127.0.0.1:5432/natta_payment_test

      - name: Build
        run: npm run build
